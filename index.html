<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Office Task Manager Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* മൊബൈൽ ഫോൺ ടച്ച് എളുപ്പമാക്കാനും ടെക്സ്റ്റ് തെളിഞ്ഞു കാണാനും */
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 antialiased">

  <!-- 1. LOGIN SECTION -->
  <div id="loginSection" class="flex min-h-screen items-center justify-center p-4">
    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-lg w-full max-w-sm border border-slate-200">
      <h2 class="text-xl font-bold text-center text-blue-600 mb-5 tracking-tight">Task Manager</h2>
      
      <label class="block text-xs font-semibold text-slate-600 mb-1">Department</label>
      <select id="loginDeptSelect" class="w-full p-2.5 border rounded-xl mb-3 text-sm bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
        <option value="" disabled selected>Select Department</option>
      </select>

      <label class="block text-xs font-semibold text-slate-600 mb-1">Passcode</label>
      <input type="password" id="loginPasscode" placeholder="Enter Passcode" class="w-full p-2.5 border rounded-xl mb-5 text-sm bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">

      <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-2.5 rounded-xl transition shadow text-sm">
        Login
      </button>
      <p id="loginErr" class="text-red-500 text-xs mt-3 text-center hidden">Invalid credentials!</p>
    </div>
  </div>

  <!-- 2. DASHBOARD SECTION -->
  <div id="dashboardSection" class="hidden max-w-2xl mx-auto p-3 sm:p-5">
    
    <!-- Compact Top Bar -->
    <header class="flex justify-between items-center bg-white px-4 py-3 rounded-xl shadow-sm mb-3 border border-slate-200">
      <div class="flex flex-col">
        <span class="text-[10px] uppercase font-bold text-slate-400 leading-tight">Logged In</span>
        <h1 id="userDisplay" class="text-base font-bold text-blue-700 leading-tight"></h1>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="openModal('contactsModal')" class="px-2.5 py-1.5 text-xs bg-slate-100 active:bg-slate-200 text-slate-700 font-medium rounded-lg border flex items-center gap-1">
          👥 Numbers
        </button>
        <button onclick="handleLogout()" class="px-2.5 py-1.5 text-xs bg-red-50 active:bg-red-100 text-red-600 font-medium rounded-lg">
          Logout
        </button>
      </div>
    </header>

    <!-- Admin Filter Box -->
    <div id="adminFilterBox" class="hidden mb-3 bg-blue-50 px-3 py-2 rounded-xl border border-blue-200 flex items-center justify-between text-xs">
      <span class="font-semibold text-blue-900">Filter:</span>
      <select id="adminDeptFilter" onchange="loadTasks()" class="p-1.5 border rounded-lg bg-white text-xs w-48">
        <option value="All">All Departments</option>
      </select>
    </div>

    <!-- Quick Action Bar -->
    <div class="flex items-center gap-2 mb-3">
      <!-- Tabs (Scrollable on small screens) -->
      <div class="flex bg-slate-200 p-0.5 rounded-xl flex-1 overflow-x-auto text-xs">
        <button onclick="setFilter('pending')" id="tab-pending" class="flex-1 py-1.5 px-3 rounded-lg font-semibold bg-white text-blue-700 shadow-sm whitespace-nowrap">Upcoming</button>
        <button onclick="setFilter('sent')" id="tab-sent" class="flex-1 py-1.5 px-3 rounded-lg font-medium text-slate-600 whitespace-nowrap">📤 Sent</button>
        <button onclick="setFilter('completed')" id="tab-completed" class="flex-1 py-1.5 px-3 rounded-lg font-medium text-slate-600 whitespace-nowrap">✅ Done</button>
      </div>
      
      <!-- New Task Button -->
      <button onclick="openModal('addTaskModal')" class="bg-emerald-600 active:bg-emerald-700 text-white font-semibold px-3 py-2 rounded-xl text-xs shadow-sm flex items-center gap-1 whitespace-nowrap">
        + Assign
      </button>
    </div>

    <!-- Tasks List Container -->
    <div id="taskContainer" class="space-y-3 pb-8">
      <p class="text-center text-slate-400 py-10 text-xs">Loading tasks...</p>
    </div>
  </div>

  <!-- ADD TASK MODAL -->
  <div id="addTaskModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 z-50">
    <div class="bg-white rounded-t-2xl sm:rounded-2xl p-5 w-full max-w-md shadow-xl max-h-[90vh] overflow-y-auto">
      <h3 class="text-base font-bold mb-3 text-slate-800">Assign New Task</h3>
      <form id="addTaskForm" onsubmit="handleAddTask(event)">
        <label class="block text-xs font-semibold text-slate-600 mb-1">Assign To</label>
        <select id="targetDept" required class="w-full p-2 border rounded-xl mb-2.5 text-xs bg-slate-50"></select>

        <label class="block text-xs font-semibold text-slate-600 mb-1">Task Title (Main Heading)</label>
        <input type="text" id="taskTitle" required placeholder="e.g. RISALA SUBMISSION" class="w-full p-2 border rounded-xl mb-2.5 text-xs bg-slate-50">

        <label class="block text-xs font-semibold text-slate-600 mb-1">Details / Reference</label>
        <textarea id="taskDetails" rows="2" placeholder="e.g. Final submission date instructions..." class="w-full p-2 border rounded-xl mb-2.5 text-xs bg-slate-50"></textarea>

        <label class="block text-xs font-semibold text-slate-600 mb-1">Target Date</label>
        <input type="date" id="targetDate" required class="w-full p-2 border rounded-xl mb-4 text-xs bg-slate-50">

        <div class="flex justify-end gap-2">
          <button type="button" onclick="closeModal('addTaskModal')" class="px-3.5 py-1.5 border rounded-xl text-xs font-medium">Cancel</button>
          <button type="submit" id="btnSaveTask" class="px-4 py-1.5 bg-blue-600 text-white rounded-xl text-xs font-semibold">Assign</button>
        </div>
      </form>
    </div>
  </div>

  <!-- EDIT TASK MODAL -->
  <div id="editTaskModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 z-50">
    <div class="bg-white rounded-t-2xl sm:rounded-2xl p-5 w-full max-w-md shadow-xl max-h-[90vh] overflow-y-auto">
      <h3 class="text-base font-bold mb-3 text-purple-700">Edit Task</h3>
      <input type="hidden" id="editTaskId">
      
      <label class="block text-xs font-semibold text-slate-600 mb-1">Assign To</label>
      <select id="editTargetDept" class="w-full p-2 border rounded-xl mb-2.5 text-xs bg-slate-50"></select>

      <label class="block text-xs font-semibold text-slate-600 mb-1">Task Title</label>
      <input type="text" id="editTaskTitle" class="w-full p-2 border rounded-xl mb-2.5 text-xs bg-slate-50">

      <label class="block text-xs font-semibold text-slate-600 mb-1">Details / Reference</label>
      <textarea id="editTaskDetails" rows="2" class="w-full p-2 border rounded-xl mb-2.5 text-xs bg-slate-50"></textarea>

      <label class="block text-xs font-semibold text-slate-600 mb-1">Target Date</label>
      <input type="date" id="editTargetDate" class="w-full p-2 border rounded-xl mb-4 text-xs bg-slate-50">

      <div class="flex justify-between items-center">
        <button type="button" onclick="deleteTask()" class="px-2.5 py-1.5 text-xs bg-red-50 text-red-600 rounded-lg font-medium">🗑️ Delete</button>
        <div class="flex gap-2">
          <button type="button" onclick="closeModal('editTaskModal')" class="px-3.5 py-1.5 border rounded-xl text-xs font-medium">Cancel</button>
          <button type="button" onclick="saveTaskEdit()" class="px-4 py-1.5 bg-purple-600 text-white rounded-xl text-xs font-semibold">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ACTION MODAL -->
  <div id="actionModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-5 w-full max-w-sm shadow-xl">
      <h3 id="actionModalTitle" class="text-base font-bold mb-3">Update Task</h3>
      <input type="hidden" id="actionTaskId">
      <input type="hidden" id="actionType">

      <div id="postponeDateGroup" class="hidden mb-2.5">
        <label class="block text-xs font-semibold text-slate-600 mb-1">New Target Date</label>
        <input type="date" id="actionNewDate" class="w-full p-2 border rounded-xl bg-slate-50 text-xs">
      </div>

      <label class="block text-xs font-semibold text-slate-600 mb-1">Remarks / Note</label>
      <textarea id="actionReason" rows="2" placeholder="Write remarks here..." class="w-full p-2 border rounded-xl mb-3 text-xs bg-slate-50"></textarea>

      <div class="flex justify-end gap-2">
        <button type="button" onclick="closeModal('actionModal')" class="px-3 py-1.5 border rounded-xl text-xs">Cancel</button>
        <button type="button" onclick="submitTaskAction()" class="px-3.5 py-1.5 bg-blue-600 text-white rounded-xl text-xs font-semibold">Update</button>
      </div>
    </div>
  </div>

  <!-- CONTACTS MODAL -->
  <div id="contactsModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 z-50">
    <div class="bg-white rounded-t-2xl sm:rounded-2xl p-5 w-full max-w-md shadow-xl max-h-[85vh] flex flex-col">
      <h3 class="text-base font-bold mb-1">WhatsApp Numbers</h3>
      <p class="text-[11px] text-slate-500 mb-3">ഫോൺ നമ്പർ ഇവിടെ നേരിട്ട് നൽകി സേവ് ചെയ്യാം (91XXXXXXXXXX)</p>
      <div id="contactsList" class="space-y-2 overflow-y-auto flex-1 pr-1"></div>
      <button onclick="closeModal('contactsModal')" class="mt-3 w-full py-2 bg-slate-800 text-white rounded-xl text-xs font-semibold">Close</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://stniqwvejaxribjfxolk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_1KnlOZFIv_gNWeuIZRPvCw_HAEUtird";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = localStorage.getItem("taskUser") || "";
    let currentFilter = "pending";
    let departmentsData = [];

    function formatDateDMY(dateStr) {
      if (!dateStr) return "";
      const parts = dateStr.split("-");
      if (parts.length === 3) {
        return parts[2] + "-" + parts[1] + "-" + parts[0];
      }
      return dateStr;
    }

    window.onload = async function() {
      await loadDepartments();
      if (currentUser) {
        initDashboard();
      }
    };

    async function loadDepartments() {
      const { data } = await db.from('departments').select('*').order('name');
      if (data) {
        departmentsData = data;
        const loginSelect = document.getElementById("loginDeptSelect");
        const targetSelect = document.getElementById("targetDept");
        const editSelect = document.getElementById("editTargetDept");
        const filterSelect = document.getElementById("adminDeptFilter");

        loginSelect.innerHTML = '<option value="" disabled selected>Select Department</option>';
        targetSelect.innerHTML = '';
        editSelect.innerHTML = '';
        filterSelect.innerHTML = '<option value="All">All Departments</option>';

        departmentsData.forEach(function(d) {
          loginSelect.add(new Option(d.name, d.name));
          if (d.name !== 'Admin') {
            targetSelect.add(new Option(d.name, d.name));
            editSelect.add(new Option(d.name, d.name));
            filterSelect.add(new Option(d.name, d.name));
          }
        });
        renderContacts();
      }
    }

    function renderContacts() {
      const list = document.getElementById("contactsList");
      list.innerHTML = departmentsData.map(function(d) {
        return '<div class="p-2.5 bg-slate-50 rounded-xl border border-slate-200 flex flex-col gap-1.5 text-xs">' +
          '<div class="flex justify-between items-center">' +
            '<span class="font-bold text-slate-800">' + d.name + '</span>' +
            (d.phone ? '<a href="https://wa.me/' + d.phone.replace(/[^0-9]/g,'') + '" target="_blank" class="px-2 py-0.5 bg-emerald-600 text-white rounded text-[10px] font-bold">Chat</a>' : '') +
          '</div>' +
          '<div class="grid grid-cols-2 gap-1.5">' +
            '<input type="text" id="head_' + d.id + '" placeholder="Head Name" value="' + (d.head_name || '') + '" class="p-1 border rounded bg-white text-xs">' +
            '<input type="text" id="phone_' + d.id + '" placeholder="91XXXXXXXXXX" value="' + (d.phone || '') + '" class="p-1 border rounded bg-white text-xs">' +
          '</div>' +
          '<button onclick="saveContact(' + d.id + ')" class="self-end px-2.5 py-1 bg-blue-600 text-white rounded text-[11px] font-medium">Save</button>' +
        '</div>';
      }).join('');
    }

    async function saveContact(deptId) {
      const headName = document.getElementById('head_' + deptId).value.trim();
      const phone = document.getElementById('phone_' + deptId).value.trim();

      const { error } = await db.from('departments').update({
        head_name: headName,
        phone: phone
      }).eq('id', deptId);

      if (!error) {
        alert("Saved successfully!");
        await loadDepartments();
        loadTasks();
      } else {
        alert("Failed to save: " + error.message);
      }
    }

    async function handleLogin() {
      const dept = document.getElementById("loginDeptSelect").value;
      const pass = document.getElementById("loginPasscode").value;
      const err = document.getElementById("loginErr");

      const { data } = await db.from('departments').select('*').eq('name', dept).eq('passcode', pass).single();

      if (data) {
        currentUser = data.name;
        localStorage.setItem("taskUser", currentUser);
        err.classList.add("hidden");
        initDashboard();
      } else {
        err.classList.remove("hidden");
      }
    }

    function initDashboard() {
      document.getElementById("loginSection").classList.add("hidden");
      document.getElementById("dashboardSection").classList.remove("hidden");
      document.getElementById("userDisplay").innerText = currentUser;

      if (currentUser === "Admin") {
        document.getElementById("adminFilterBox").classList.remove("hidden");
      }
      loadTasks();
    }

    function handleLogout() {
      localStorage.removeItem("taskUser");
      location.reload();
    }

    function setFilter(type) {
      currentFilter = type;
      ['pending', 'sent', 'completed'].forEach(function(tab) {
        const btn = document.getElementById('tab-' + tab);
        if (tab === type) {
          btn.className = "flex-1 py-1.5 px-3 rounded-lg font-semibold bg-white text-blue-700 shadow-sm whitespace-nowrap";
        } else {
          btn.className = "flex-1 py-1.5 px-3 rounded-lg font-medium text-slate-600 whitespace-nowrap";
        }
      });
      loadTasks();
    }

    async function loadTasks() {
      const container = document.getElementById("taskContainer");
      container.innerHTML = '<p class="text-center text-slate-400 py-8 text-xs">Loading...</p>';

      let query = db.from('tasks').select('*');

      if (currentFilter === 'sent') {
        query = query.eq('assigned_by', currentUser);
      } else {
        if (currentUser !== 'Admin') {
          query = query.eq('assigned_to', currentUser);
        } else {
          const adminFilter = document.getElementById("adminDeptFilter").value;
          if (adminFilter !== "All") {
            query = query.eq('assigned_to', adminFilter);
          }
        }

        if (currentFilter === 'completed') {
          query = query.eq('status', 'Completed');
        } else {
          query = query.neq('status', 'Completed');
        }
      }

      query = query.order('target_date', { ascending: true });
      const { data: tasks } = await query;

      if (!tasks || tasks.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-400 py-8 text-xs">No tasks found.</p>';
        return;
      }

      container.innerHTML = tasks.map(function(t) {
        const receiver = departmentsData.find(function(d) { return d.name === t.assigned_to; });
        const sender = departmentsData.find(function(d) { return d.name === t.assigned_by; });
        const displayDate = formatDateDMY(t.target_date);

        let waBtn = '';
        const isSenderOrAdmin = (currentUser === t.assigned_by || currentUser === 'Admin');
        const receiverHead = (receiver && receiver.head_name) ? ' (' + receiver.head_name + ')' : '';
        const senderHead = (sender && sender.head_name) ? ' (' + sender.head_name + ')' : '';

        if (isSenderOrAdmin) {
          if (receiver && receiver.phone) {
            const cleanPhone = receiver.phone.replace(/[^0-9]/g, '');
            const msgLines = [
              "Assalamu Alaikum,",
              "To: *" + t.assigned_to + "*" + receiverHead,
              "",
              "*Task:* " + t.title,
              t.details ? "*Details:* " + t.details : "",
              "*Target Date:* " + displayDate,
              "*Status:* " + t.status,
              "",
              "ഈ വർക്ക് സംബന്ധിച്ച നിലവിലെ വിവരം ദയവായി അപ്‌ഡേറ്റ് ചെയ്യുമല്ലോ."
            ].filter(function(line) { return line !== ""; });

            const finalMsg = encodeURIComponent(msgLines.join("\n"));
            waBtn = '<a href="https://api.whatsapp.com/send?phone=' + cleanPhone + '&text=' + finalMsg + '" target="_blank" class="w-full py-2 bg-emerald-600 active:bg-emerald-700 text-white rounded-lg flex items-center justify-center gap-1.5 font-semibold text-xs shadow-sm">💬 WhatsApp ' + t.assigned_to + '</a>';
          } else {
            waBtn = '<button onclick="openModal(\'contactsModal\')" class="w-full py-1.5 bg-slate-200 active:bg-slate-300 text-slate-700 rounded-lg text-xs font-semibold">⚠️ Add Phone (' + t.assigned_to + ')</button>';
          }
        } else {
          if (sender && sender.phone) {
            const cleanPhone = sender.phone.replace(/[^0-9]/g, '');
            const msgLines = [
              "Assalamu Alaikum,",
              "To: *" + t.assigned_by + "*" + senderHead,
              "",
              "*Re:* " + t.title,
              t.details ? "*Details:* " + t.details : "",
              "*Target Date:* " + displayDate,
              "",
              "ഈ വർക്ക് പൂർത്തിയായിട്ടുണ്ട് / അപ്‌ഡേറ്റ് അറിയിക്കുന്നു. ദയവായി പരിശോധിക്കുക."
            ].filter(function(line) { return line !== ""; });

            const finalMsg = encodeURIComponent(msgLines.join("\n"));
            waBtn = '<a href="https://api.whatsapp.com/send?phone=' + cleanPhone + '&text=' + finalMsg + '" target="_blank" class="w-full py-2 bg-emerald-600 active:bg-emerald-700 text-white rounded-lg flex items-center justify-center gap-1.5 font-semibold text-xs shadow-sm">💬 Reply to ' + t.assigned_by + '</a>';
          } else {
            waBtn = '<button onclick="openModal(\'contactsModal\')" class="w-full py-1.5 bg-slate-200 active:bg-slate-300 text-slate-700 rounded-lg text-xs font-semibold">⚠️ Add Phone (' + t.assigned_by + ')</button>';
          }
        }

        const detailsHtml = t.details ? '<p class="text-xs text-slate-600 mt-1 whitespace-pre-line leading-relaxed">' + t.details + '</p>' : '';
        const remarksHtml = t.remarks ? '<div class="bg-amber-50 text-amber-900 border border-amber-200 p-2 rounded-lg text-[11px] whitespace-pre-line my-2">📝 ' + t.remarks + '</div>' : '';
        const statusBadge = (t.status === 'Completed') 
          ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">Completed</span>'
          : '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">Pending</span>';

        // കോംപാക്റ്റ് 4 ബട്ടണുകൾ ഒരൊറ്റ വരിയിൽ ഗ്രിഡ് ആയി
        const actionGrid = (t.status !== 'Completed') ? 
          '<div class="grid grid-cols-4 gap-1.5 mb-2">' +
            '<button onclick="openActionModal(' + t.id + ', \'complete\')" class="py-1.5 bg-emerald-600 active:bg-emerald-700 text-white rounded-lg font-medium text-center text-[11px]">Done</button>' +
            '<button onclick="openActionModal(' + t.id + ', \'postpone\')" class="py-1.5 bg-amber-500 active:bg-amber-600 text-white rounded-lg font-medium text-center text-[11px]">Postpone</button>' +
            '<button onclick="openActionModal(' + t.id + ', \'note\')" class="py-1.5 bg-slate-600 active:bg-slate-700 text-white rounded-lg font-medium text-center text-[11px]">Note</button>' +
            '<button onclick="openEditModal(' + t.id + ', \'' + encodeURIComponent(t.title) + '\', \'' + encodeURIComponent(t.details || '') + '\', \'' + t.target_date + '\', \'' + t.assigned_to + '\')" class="py-1.5 bg-purple-600 active:bg-purple-700 text-white rounded-lg font-medium text-center text-[11px]">Edit</button>' +
          '</div>' : 
          '<div class="flex justify-end mb-2">' +
            '<button onclick="openEditModal(' + t.id + ', \'' + encodeURIComponent(t.title) + '\', \'' + encodeURIComponent(t.details || '') + '\', \'' + t.target_date + '\', \'' + t.assigned_to + '\')" class="px-3 py-1 bg-purple-600 text-white rounded-lg font-medium text-xs">Edit</button>' +
          '</div>';

        return '<div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200">' +
          '<div class="flex justify-between items-start gap-2 mb-1">' +
            '<h4 class="font-bold text-slate-900 text-sm leading-snug flex-1">' + t.title + '</h4>' +
            statusBadge +
          '</div>' +

          detailsHtml +

          '<div class="text-[11px] text-slate-500 my-2 flex flex-wrap gap-x-2 gap-y-1 items-center bg-slate-50 p-1.5 rounded-lg border border-slate-100">' +
            '<span>📅 <b class="text-slate-700">' + displayDate + '</b></span>' +
            '<span>•</span>' +
            '<span>To: <b class="text-slate-700">' + t.assigned_to + receiverHead + '</b></span>' +
            '<span>•</span>' +
            '<span class="text-purple-700 font-medium">From: ' + t.assigned_by + '</span>' +
          '</div>' +

          remarksHtml +
          
          '<div class="pt-2 border-t border-slate-100">' +
            actionGrid +
            waBtn +
          '</div>' +
        '</div>';
      }).join('');
    }

    // ADD TASK
    async function handleAddTask(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSaveTask");
      btn.disabled = true;

      const targetDept = document.getElementById("targetDept").value;
      const title = document.getElementById("taskTitle").value;
      const details = document.getElementById("taskDetails").value;
      const date = document.getElementById("targetDate").value;

      await db.from('tasks').insert([{
        title: title,
        details: details,
        target_date: date,
        assigned_to: targetDept,
        assigned_by: currentUser,
        status: 'Pending'
      }]);

      btn.disabled = false;
      document.getElementById("addTaskForm").reset();
      closeModal('addTaskModal');
      loadTasks();
    }

    // EDIT TASK
    function openEditModal(id, titleEncoded, detailsEncoded, date, assignedTo) {
      document.getElementById("editTaskId").value = id;
      document.getElementById("editTaskTitle").value = decodeURIComponent(titleEncoded);
      document.getElementById("editTaskDetails").value = decodeURIComponent(detailsEncoded);
      document.getElementById("editTargetDate").value = date;
      document.getElementById("editTargetDept").value = assignedTo;
      openModal('editTaskModal');
    }

    async function saveTaskEdit() {
      const id = document.getElementById("editTaskId").value;
      const title = document.getElementById("editTaskTitle").value;
      const details = document.getElementById("editTaskDetails").value;
      const date = document.getElementById("editTargetDate").value;
      const dept = document.getElementById("editTargetDept").value;

      await db.from('tasks').update({
        title: title,
        details: details,
        target_date: date,
        assigned_to: dept
      }).eq('id', id);

      closeModal('editTaskModal');
      loadTasks();
    }

    async function deleteTask() {
      if (confirm("Are you sure you want to delete this task?")) {
        const id = document.getElementById("editTaskId").value;
        await db.from('tasks').delete().eq('id', id);
        closeModal('editTaskModal');
        loadTasks();
      }
    }

    // ACTION MODAL
    function openActionModal(id, type) {
      document.getElementById("actionTaskId").value = id;
      document.getElementById("actionType").value = type;
      document.getElementById("actionReason").value = "";

      const dateGroup = document.getElementById("postponeDateGroup");
      const title = document.getElementById("actionModalTitle");

      if (type === 'postpone') {
        title.innerText = "Postpone Task";
        dateGroup.classList.remove("hidden");
      } else {
        dateGroup.classList.add("hidden");
        title.innerText = (type === 'complete') ? "Complete Task" : "Add Note";
      }

      openModal('actionModal');
    }

    async function submitTaskAction() {
      const id = document.getElementById("actionTaskId").value;
      const type = document.getElementById("actionType").value;
      const reason = document.getElementById("actionReason").value;
      const newDate = document.getElementById("actionNewDate").value;

      const { data: task } = await db.from('tasks').select('remarks').eq('id', id).single();
      let currentRemarks = (task && task.remarks) ? task.remarks : "";
      let updates = {};

      if (type === 'complete') {
        updates.status = 'Completed';
        if (reason) {
          updates.remarks = currentRemarks ? currentRemarks + "\n[Completed: " + reason + "]" : "Completed: " + reason;
        }
      } else if (type === 'postpone') {
        if (!newDate) { alert("Please pick a new date"); return; }
        updates.target_date = newDate;
        updates.remarks = currentRemarks ? currentRemarks + "\n[Postponed to " + newDate + ": " + reason + "]" : "Postponed to " + newDate + ": " + reason;
      } else if (type === 'note') {
        if (!reason) { alert("Please enter a note"); return; }
        updates.remarks = currentRemarks ? currentRemarks + "\n• " + reason : "• " + reason;
      }

      await db.from('tasks').update(updates).eq('id', id);
      closeModal('actionModal');
      loadTasks();
    }

    function openModal(id) { document.getElementById(id).classList.remove("hidden"); }
    function closeModal(id) { document.getElementById(id).classList.add("hidden"); }
  </script>
</body>
</html>
