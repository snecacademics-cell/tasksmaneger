<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Task Manager Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- LOGIN SECTION -->
  <div id="loginSection" class="flex min-h-screen items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
      <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">Task Manager</h2>
      
      <label class="block text-sm font-semibold mb-1">Department</label>
      <select id="loginDeptSelect" class="w-full p-3 border rounded-xl mb-4 bg-slate-50">
        <option value="" disabled selected>Select Department</option>
      </select>

      <label class="block text-sm font-semibold mb-1">Passcode</label>
      <input type="password" id="loginPasscode" placeholder="Enter Passcode" class="w-full p-3 border rounded-xl mb-6 bg-slate-50">

      <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition shadow-md">
        Login
      </button>
      <p id="loginErr" class="text-red-500 text-sm mt-3 text-center hidden">Invalid credentials!</p>
    </div>
  </div>

  <!-- DASHBOARD SECTION -->
  <div id="dashboardSection" class="hidden max-w-4xl mx-auto p-4 sm:p-6">
    <header class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm mb-6 border">
      <div>
        <span class="text-xs font-semibold text-slate-400 uppercase">Logged in as</span>
        <h1 id="userDisplay" class="text-xl font-bold text-blue-600"></h1>
      </div>
      <div class="flex gap-2">
        <button onclick="openModal('contactsModal')" class="px-3 py-1.5 text-xs bg-slate-100 text-slate-700 font-semibold rounded-lg hover:bg-slate-200 border">
          👥 Numbers / Heads
        </button>
        <button onclick="handleLogout()" class="px-3 py-1.5 text-xs bg-red-50 text-red-600 font-semibold rounded-lg hover:bg-red-100">
          Logout
        </button>
      </div>
    </header>

    <!-- Admin Filter Box -->
    <div id="adminFilterBox" class="hidden mb-4 bg-blue-50 p-3 rounded-xl border border-blue-200 flex items-center gap-3">
      <label class="text-sm font-semibold text-blue-900">Filter Department:</label>
      <select id="adminDeptFilter" onchange="loadTasks()" class="p-2 border rounded-lg bg-white text-sm">
        <option value="All">All Departments</option>
      </select>
    </div>

    <!-- Actions & Filter Tabs -->
    <div class="flex flex-col sm:flex-row justify-between gap-3 mb-6">
      <div class="flex gap-2 overflow-x-auto pb-1">
        <button onclick="setFilter('pending')" id="tab-pending" class="px-4 py-2 text-sm font-semibold rounded-xl bg-blue-600 text-white shadow-sm">Upcoming</button>
        <button onclick="setFilter('sent')" id="tab-sent" class="px-4 py-2 text-sm font-semibold rounded-xl bg-white text-slate-600 border">📤 Sent</button>
        <button onclick="setFilter('completed')" id="tab-completed" class="px-4 py-2 text-sm font-semibold rounded-xl bg-white text-slate-600 border">✅ History</button>
      </div>
      <button onclick="openModal('addTaskModal')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 py-2 rounded-xl text-sm shadow-sm">
        + Assign New Task
      </button>
    </div>

    <!-- Task List -->
    <div id="taskContainer" class="space-y-4">
      <p class="text-center text-slate-400 py-10">Loading tasks...</p>
    </div>
  </div>

  <!-- ADD TASK MODAL -->
  <div id="addTaskModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 w-full max-w-lg shadow-xl">
      <h3 class="text-lg font-bold mb-4">Assign New Task</h3>
      <form id="addTaskForm" onsubmit="handleAddTask(event)">
        <label class="block text-sm font-medium mb-1">Assign To (Department)</label>
        <select id="targetDept" required class="w-full p-2.5 border rounded-xl mb-3 bg-slate-50"></select>

        <label class="block text-sm font-medium mb-1">Task Title (Main Heading)</label>
        <input type="text" id="taskTitle" required placeholder="e.g. Monthly Plan Preparation" class="w-full p-2.5 border rounded-xl mb-3 bg-slate-50">

        <label class="block text-sm font-medium mb-1">Details / Reference / Instructions</label>
        <textarea id="taskDetails" rows="3" placeholder="e.g. Monthly plans for PG by Koya Faizy and Shabeer Faizy. Collect and verify." class="w-full p-2.5 border rounded-xl mb-3 bg-slate-50"></textarea>

        <label class="block text-sm font-medium mb-1">Target Date</label>
        <input type="date" id="targetDate" required class="w-full p-2.5 border rounded-xl mb-5 bg-slate-50">

        <div class="flex justify-end gap-2">
          <button type="button" onclick="closeModal('addTaskModal')" class="px-4 py-2 border rounded-xl text-sm">Cancel</button>
          <button type="submit" id="btnSaveTask" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-sm font-semibold">Assign</button>
        </div>
      </form>
    </div>
  </div>

  <!-- EDIT TASK MODAL -->
  <div id="editTaskModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 w-full max-w-lg shadow-xl">
      <h3 class="text-lg font-bold mb-4 text-purple-700">Edit Task</h3>
      <input type="hidden" id="editTaskId">
      
      <label class="block text-sm font-medium mb-1">Assign To (Department)</label>
      <select id="editTargetDept" class="w-full p-2.5 border rounded-xl mb-3 bg-slate-50"></select>

      <label class="block text-sm font-medium mb-1">Task Title</label>
      <input type="text" id="editTaskTitle" class="w-full p-2.5 border rounded-xl mb-3 bg-slate-50">

      <label class="block text-sm font-medium mb-1">Details / Reference</label>
      <textarea id="editTaskDetails" rows="3" class="w-full p-2.5 border rounded-xl mb-3 bg-slate-50"></textarea>

      <label class="block text-sm font-medium mb-1">Target Date</label>
      <input type="date" id="editTargetDate" class="w-full p-2.5 border rounded-xl mb-5 bg-slate-50">

      <div class="flex justify-between items-center">
        <button type="button" onclick="deleteTask()" class="px-3 py-2 text-xs bg-red-100 text-red-700 rounded-lg font-semibold hover:bg-red-200">🗑️ Delete</button>
        <div class="flex gap-2">
          <button type="button" onclick="closeModal('editTaskModal')" class="px-4 py-2 border rounded-xl text-sm">Cancel</button>
          <button type="button" onclick="saveTaskEdit()" class="px-4 py-2 bg-purple-600 text-white rounded-xl text-sm font-semibold">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ACTION MODAL -->
  <div id="actionModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl">
      <h3 id="actionModalTitle" class="text-lg font-bold mb-3">Update Task</h3>
      <input type="hidden" id="actionTaskId">
      <input type="hidden" id="actionType">

      <div id="postponeDateGroup" class="hidden mb-3">
        <label class="block text-sm font-medium mb-1">New Target Date</label>
        <input type="date" id="actionNewDate" class="w-full p-2.5 border rounded-xl bg-slate-50">
      </div>

      <label class="block text-sm font-medium mb-1">Note / Remarks</label>
      <textarea id="actionReason" rows="2" placeholder="Enter reason or remark..." class="w-full p-2.5 border rounded-xl mb-4 bg-slate-50"></textarea>

      <div class="flex justify-end gap-2">
        <button type="button" onclick="closeModal('actionModal')" class="px-4 py-2 border rounded-xl text-sm">Cancel</button>
        <button type="button" onclick="submitTaskAction()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-sm font-semibold">Update</button>
      </div>
    </div>
  </div>

  <!-- CONTACTS MODAL -->
  <div id="contactsModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl max-h-[85vh] flex flex-col">
      <h3 class="text-lg font-bold mb-1">Department WhatsApp Numbers</h3>
      <p class="text-xs text-slate-500 mb-3">ഫോൺ നമ്പർ ഇവിടെ നേരിട്ട് ടൈപ്പ് ചെയ്ത് സേവ് ചെയ്യാം (ഉദാ: 919876543210)</p>
      <div id="contactsList" class="space-y-3 overflow-y-auto flex-1 pr-1"></div>
      <button onclick="closeModal('contactsModal')" class="mt-4 w-full py-2 bg-slate-800 text-white rounded-xl text-sm font-semibold">Close</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://stniqwvejaxribjfxolk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_1KnlOZFIv_gNWeuIZRPvCw_HAEUtird";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = localStorage.getItem("taskUser") || "";
    let currentFilter = "pending";
    let departmentsData = [];

    window.onload = async () => {
      await loadDepartments();
      if (currentUser) initDashboard();
    };

    async function loadDepartments() {
      const { data } = await db.from('departments').select('*').order('name');
      if (data) {
        departmentsData = data;
        const loginSelect = document.getElementById("loginDeptSelect");
        const targetSelect = document.getElementById("targetDept");
        const editSelect = document.getElementById("editTargetDept");
        const filterSelect = document.getElementById("adminDeptFilter");

        loginSelect.innerHTML = '<option value="" disabled selected>Select Department</option>';
        targetSelect.innerHTML = '';
        editSelect.innerHTML = '';
        filterSelect.innerHTML = '<option value="All">All Departments</option>';

        departmentsData.forEach(d => {
          loginSelect.add(new Option(d.name, d.name));
          if (d.name !== 'Admin') {
            targetSelect.add(new Option(d.name, d.name));
            editSelect.add(new Option(d.name, d.name));
            filterSelect.add(new Option(d.name, d.name));
          }
        });
        renderContacts();
      }
    }

    function renderContacts() {
      const list = document.getElementById("contactsList");
      list.innerHTML = departmentsData.map(d => `
        <div class="p-3 bg-slate-50 rounded-xl border flex flex-col gap-2 text-xs">
          <div class="flex justify-between items-center">
            <span class="font-bold text-slate-800 text-sm">${d.name}</span>
            ${d.phone ? `<a href="https://wa.me/${d.phone.replace(/[^0-9]/g,'')}" target="_blank" class="px-2 py-0.5 bg-green-500 text-white rounded font-bold">Chat</a>` : ''}
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="head_${d.id}" placeholder="Head Name / Role" value="${d.head_name || ''}" class="p-1.5 border rounded bg-white">
            <input type="text" id="phone_${d.id}" placeholder="91XXXXXXXXXX" value="${d.phone || ''}" class="p-1.5 border rounded bg-white">
          </div>
          <button onclick="saveContact(${d.id})" class="self-end px-3 py-1 bg-blue-600 text-white rounded font-medium">Save Number</button>
        </div>
      `).join('');
    }

    async function saveContact(deptId) {
      const headName = document.getElementById(`head_${deptId}`).value.trim();
      const phone = document.getElementById(`phone_${deptId}`).value.trim();

      const { error } = await db.from('departments').update({
        head_name: headName,
        phone: phone
      }).eq('id', deptId);

      if (!error) {
        alert("Saved successfully!");
        await loadDepartments();
        loadTasks();
      } else {
        alert("Failed to save: " + error.message);
      }
    }

    async function handleLogin() {
      const dept = document.getElementById("loginDeptSelect").value;
      const pass = document.getElementById("loginPasscode").value;
      const err = document.getElementById("loginErr");

      const { data } = await db.from('departments').select('*').eq('name', dept).eq('passcode', pass).single();

      if (data) {
        currentUser = data.name;
        localStorage.setItem("taskUser", currentUser);
        err.classList.add("hidden");
        initDashboard();
      } else {
        err.classList.remove("hidden");
      }
    }

    function initDashboard() {
      document.getElementById("loginSection").classList.add("hidden");
      document.getElementById("dashboardSection").classList.remove("hidden");
      document.getElementById("userDisplay").innerText = currentUser;

      if (currentUser === "Admin") {
        document.getElementById("adminFilterBox").classList.remove("hidden");
      }
      loadTasks();
    }

    function handleLogout() {
      localStorage.removeItem("taskUser");
      location.reload();
    }

    function setFilter(type) {
      currentFilter = type;
      ['pending', 'sent', 'completed'].forEach(tab => {
        const btn = document.getElementById(`tab-${tab}`);
        btn.className = (tab === type)
          ? "px-4 py-2 text-sm font-semibold rounded-xl bg-blue-600 text-white shadow-sm"
          : "px-4 py-2 text-sm font-semibold rounded-xl bg-white text-slate-600 border";
      });
      loadTasks();
    }
function formatDateDMY(dateStr) {
  if (!dateStr) return "";
  const parts = dateStr.split("-");
  if (parts.length === 3) {
    return `${parts[2]}-${parts[1]}-${parts[0]}`;
  }
  return dateStr;
}
    
    async function loadTasks() {
      const container = document.getElementById("taskContainer");
      container.innerHTML = `<p class="text-center text-slate-400 py-10">Loading...</p>`;

      let query = db.from('tasks').select('*');

      if (currentFilter === 'sent') {
        query = query.eq('assigned_by', currentUser);
      } else {
        if (currentUser !== 'Admin') {
          query = query.eq('assigned_to', currentUser);
        } else {
          const adminFilter = document.getElementById("adminDeptFilter").value;
          if (adminFilter !== "All") query = query.eq('assigned_to', adminFilter);
        }

        if (currentFilter === 'completed') {
          query = query.eq('status', 'Completed');
        } else {
          query = query.neq('status', 'Completed');
        }
      }

      query = query.order('target_date', { ascending: true });
      const { data: tasks } = await query;

      if (!tasks || tasks.length === 0) {
        container.innerHTML = `<p class="text-center text-slate-400 py-10">No tasks found.</p>`;
        return;
      }

      container.innerHTML = tasks.map(t => {
        const receiver = departmentsData.find(d => d.name === t.assigned_to);
        const sender = departmentsData.find(d => d.name === t.assigned_by);

        // തീയതി DD-MM-YYYY ഫോർമാറ്റിലേക്ക് മാറ്റുന്നു
        const displayDate = formatDateDMY(t.target_date);

        let waBtn = '';
        const isSenderOrAdmin = (currentUser === t.assigned_by || currentUser === 'Admin');

        // അഭിസംബോധനയും പേരും കൃത്യമാക്കുന്നു
        const receiverHead = receiver?.head_name ? ` (${receiver.head_name})` : '';
        const senderHead = sender?.head_name ? ` (${sender.head_name})` : '';

        if (isSenderOrAdmin) {
          if (receiver && receiver.phone) {
            const cleanPhone = receiver.phone.replace(/[^0-9]/g, '');
            
            // എൻകോഡിംഗ് പ്രശ്നം ഇല്ലാത്ത വൃത്തിയുള്ള ഫോർമാറ്റ്
            const msgLines = [
              "Assalamu Alaikum,",
              `To: *${t.assigned_to}*${receiverHead}`,
              "",
              `*Task:* ${t.title}`,
              t.details ? `*Details:* ${t.details}` : "",
              `*Target Date:* ${displayDate}`,
              `*Status:* ${t.status}`,
              "",
              "ഈ വർക്ക് സംബന്ധിച്ച നിലവിലെ വിവരം ദയവായി അപ്‌ഡേറ്റ് ചെയ്യുമല്ലോ."
            ].filter(line => line !== null && line !== undefined);

            const finalMsg = encodeURIComponent(msgLines.join("\n"));
            waBtn = `<a href="https://api.whatsapp.com/send?phone=${cleanPhone}&text=${finalMsg}" target="_blank" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg flex items-center gap-1 font-semibold text-xs shadow-sm">💬 WhatsApp ${t.assigned_to}</a>`;
          } else {
            waBtn = `<button onclick="openModal('contactsModal')" class="px-2.5 py-1.5 bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold hover:bg-slate-300">⚠️ Add Phone (${t.assigned_to})</button>`;
          }
        } else {
          if (sender && sender.phone) {
            const cleanPhone = sender.phone.replace(/[^0-9]/g, '');
            
            const msgLines = [
              "Assalamu Alaikum,",
              `To: *${t.assigned_by}*${senderHead}`,
              "",
              `*Re:* ${t.title}`,
              t.details ? `*Details:* ${t.details}` : "",
              `*Target Date:* ${displayDate}`,
              "",
              "ഈ വർക്ക് പൂർത്തിയായിട്ടുണ്ട് / അപ്‌ഡേറ്റ് അറിയിക്കുന്നു. ദയവായി പരിശോധിക്കുക."
            ].filter(line => line !== null && line !== undefined);

            const finalMsg = encodeURIComponent(msgLines.join("\n"));
            waBtn = `<a href="https://api.whatsapp.com/send?phone=${cleanPhone}&text=${finalMsg}" target="_blank" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg flex items-center gap-1 font-semibold text-xs shadow-sm">💬 Reply to ${t.assigned_by}</a>`;
          } else {
            waBtn = `<button onclick="openModal('contactsModal')" class="px-2.5 py-1.5 bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold hover:bg-slate-300">⚠️ Add Phone (${t.assigned_by})</button>`;
          }
        }

        return `
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-start mb-2">
              <div>
                <h4 class="font-bold text-slate-900 text-base">${t.title}</h4>
                ${t.details ? `<p class="text-xs text-slate-600 mt-1 whitespace-pre-line">${t.details}</p>` : ''}
              </div>
              <span class="text-xs px-2.5 py-1 rounded-full font-medium ${t.status === 'Completed' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                ${t.status}
              </span>
            </div>

            <div class="text-xs text-slate-500 mb-3 flex flex-wrap gap-2 items-center mt-2">
              <span>📅 ${displayDate}</span>
              <span>•</span>
              <span class="bg-slate-100 px-2 py-0.5 rounded font-medium">To: ${t.assigned_to}${receiverHead}</span>
              <span class="bg-purple-50 text-purple-700 px-2 py-0.5 rounded font-medium">From: ${t.assigned_by}</span>
            </div>

            ${t.remarks ? `<div class="bg-amber-50 text-amber-900 border border-amber-200 p-2.5 rounded-lg text-xs whitespace-pre-line mb-3">📝 ${t.remarks}</div>` : ''}

            <div class="flex flex-wrap gap-2 pt-3 border-t text-xs items-center justify-between">
              <div class="flex flex-wrap gap-1.5">
                ${t.status !== 'Completed' ? `
                  <button onclick="openActionModal(${t.id}, 'complete')" class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 font-medium">✅ Complete</button>
                  <button onclick="openActionModal(${t.id}, 'postpone')" class="px-3 py-1.5 bg-amber-500 text-white rounded-lg hover:bg-amber-600 font-medium">➡️ Postpone</button>
                  <button onclick="openActionModal(${t.id}, 'note')" class="px-3 py-1.5 bg-slate-600 text-white rounded-lg hover:bg-slate-700 font-medium">📝 Note</button>
                ` : ''}
                <button onclick="openEditModal(${t.id}, '${encodeURIComponent(t.title)}', '${encodeURIComponent(t.details || '')}', '${t.target_date}', '${t.assigned_to}')" class="px-3 py-1.5 bg-purple-600 text-white rounded-lg hover:bg-purple-700 font-medium">✏️ Edit</button>
              </div>
              <div class="mt-2 sm:mt-0">${waBtn}</div>
            </div>
          </div>
        `;
      }).join('');
        return `
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-start mb-2">
              <div>
                <h4 class="font-bold text-slate-900 text-base">${t.title}</h4>
                ${t.details ? `<p class="text-xs text-slate-600 mt-1 whitespace-pre-line">${t.details}</p>` : ''}
              </div>
              <span class="text-xs px-2.5 py-1 rounded-full font-medium ${t.status === 'Completed' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                ${t.status}
              </span>
            </div>

            <div class="text-xs text-slate-500 mb-3 flex flex-wrap gap-2 items-center mt-2">
              <span>📅 ${t.target_date}</span>
              <span>•</span>
              <span class="bg-slate-100 px-2 py-0.5 rounded font-medium">To: ${t.assigned_to}${receiverHead}</span>
              <span class="bg-purple-50 text-purple-700 px-2 py-0.5 rounded font-medium">From: ${t.assigned_by}</span>
            </div>

            ${t.remarks ? `<div class="bg-amber-50 text-amber-900 border border-amber-200 p-2.5 rounded-lg text-xs whitespace-pre-line mb-3">📝 ${t.remarks}</div>` : ''}

            <div class="flex flex-wrap gap-2 pt-3 border-t text-xs items-center justify-between">
              <div class="flex flex-wrap gap-1.5">
                ${t.status !== 'Completed' ? `
                  <button onclick="openActionModal(${t.id}, 'complete')" class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 font-medium">✅ Complete</button>
                  <button onclick="openActionModal(${t.id}, 'postpone')" class="px-3 py-1.5 bg-amber-500 text-white rounded-lg hover:bg-amber-600 font-medium">➡️ Postpone</button>
                  <button onclick="openActionModal(${t.id}, 'note')" class="px-3 py-1.5 bg-slate-600 text-white rounded-lg hover:bg-slate-700 font-medium">📝 Note</button>
                ` : ''}
                <button onclick="openEditModal(${t.id}, '${encodeURIComponent(t.title)}', '${encodeURIComponent(t.details || '')}', '${t.target_date}', '${t.assigned_to}')" class="px-3 py-1.5 bg-purple-600 text-white rounded-lg hover:bg-purple-700 font-medium">✏️ Edit</button>
              </div>
              <div class="mt-2 sm:mt-0">${waBtn}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    // ADD TASK
    async function handleAddTask(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSaveTask");
      btn.disabled = true;

      const targetDept = document.getElementById("targetDept").value;
      const title = document.getElementById("taskTitle").value;
      const details = document.getElementById("taskDetails").value;
      const date = document.getElementById("targetDate").value;

      await db.from('tasks').insert([{
        title: title,
        details: details,
        target_date: date,
        assigned_to: targetDept,
        assigned_by: currentUser,
        status: 'Pending'
      }]);

      btn.disabled = false;
      document.getElementById("addTaskForm").reset();
      closeModal('addTaskModal');
      loadTasks();
    }

    // EDIT TASK
    function openEditModal(id, titleEncoded, detailsEncoded, date, assignedTo) {
      document.getElementById("editTaskId").value = id;
      document.getElementById("editTaskTitle").value = decodeURIComponent(titleEncoded);
      document.getElementById("editTaskDetails").value = decodeURIComponent(detailsEncoded);
      document.getElementById("editTargetDate").value = date;
      document.getElementById("editTargetDept").value = assignedTo;
      openModal('editTaskModal');
    }

    async function saveTaskEdit() {
      const id = document.getElementById("editTaskId").value;
      const title = document.getElementById("editTaskTitle").value;
      const details = document.getElementById("editTaskDetails").value;
      const date = document.getElementById("editTargetDate").value;
      const dept = document.getElementById("editTargetDept").value;

      await db.from('tasks').update({
        title: title,
        details: details,
        target_date: date,
        assigned_to: dept
      }).eq('id', id);

      closeModal('editTaskModal');
      loadTasks();
    }

    async function deleteTask() {
      if (confirm("Are you sure you want to delete this task?")) {
        const id = document.getElementById("editTaskId").value;
        await db.from('tasks').delete().eq('id', id);
        closeModal('editTaskModal');
        loadTasks();
      }
    }

    // ACTION MODAL
    function openActionModal(id, type) {
      document.getElementById("actionTaskId").value = id;
      document.getElementById("actionType").value = type;
      document.getElementById("actionReason").value = "";

      const dateGroup = document.getElementById("postponeDateGroup");
      const title = document.getElementById("actionModalTitle");

      if (type === 'postpone') {
        title.innerText = "Postpone Task";
        dateGroup.classList.remove("hidden");
      } else {
        dateGroup.classList.add("hidden");
        title.innerText = type === 'complete' ? "Complete Task" : "Add Note";
      }

      openModal('actionModal');
    }

    async function submitTaskAction() {
      const id = document.getElementById("actionTaskId").value;
      const type = document.getElementById("actionType").value;
      const reason = document.getElementById("actionReason").value;
      const newDate = document.getElementById("actionNewDate").value;

      const { data: task } = await db.from('tasks').select('remarks').eq('id', id).single();
      let currentRemarks = task?.remarks || "";
      let updates = {};

      if (type === 'complete') {
        updates.status = 'Completed';
        if (reason) updates.remarks = currentRemarks ? `${currentRemarks}\n[Completed: ${reason}]` : `Completed: ${reason}`;
      } else if (type === 'postpone') {
        if (!newDate) { alert("Please pick a new date"); return; }
        updates.target_date = newDate;
        updates.remarks = currentRemarks ? `${currentRemarks}\n[Postponed to ${newDate}: ${reason}]` : `Postponed to ${newDate}: ${reason}`;
      } else if (type === 'note') {
        if (!reason) { alert("Please enter a note"); return; }
        updates.remarks = currentRemarks ? `${currentRemarks}\n• ${reason}` : `• ${reason}`;
      }

      await db.from('tasks').update(updates).eq('id', id);
      closeModal('actionModal');
      loadTasks();
    }

    function openModal(id) { document.getElementById(id).classList.remove("hidden"); }
    function closeModal(id) { document.getElementById(id).classList.add("hidden"); }
  </script>
</body>
</html>
